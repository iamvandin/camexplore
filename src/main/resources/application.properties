spring.application.name=lokalkh
server.port=8080

# ---- Database (default: file-based H2, data persists in ./data) ----
spring.datasource.url=jdbc:h2:file:./data/lokalkh;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---- Security ----
# Override in production with the JWT_SECRET environment variable (min 32 characters)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789-abcdefghijklmnop}
app.jwt.expiration-minutes=720
# Only needed if the frontend is served from a different origin than the backend
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

# ---- Sample data (users + places) inserted when the database is empty ----
app.seed.enabled=true

spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
